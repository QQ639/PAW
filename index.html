<style>

  @media (max-width:760px){.two{grid-template-columns:1fr}dl.info{grid-template-columns:110px 1fr}header h1{font-size:14px}}

<script>
const BANKS = ['ธนาคารกรุงเทพ','ธนาคารกสิกรไทย','ธนาคารกรุงไทย','ธนาคารไทยพาณิชย์','ธนาคารกรุงศรีอยุธยา',
  'ธนาคารทหารไทยธนชาต (ttb)','ธนาคารออมสิน','ธ.ก.ส.','ธนาคารอาคารสงเคราะห์','ธนาคารยูโอบี','ธนาคารซีไอเอ็มบี ไทย',
  'ธนาคารเกียรตินาคินภัทร','ธนาคารทิสโก้','ธนาคารแลนด์ แอนด์ เฮ้าส์','ธนาคารไอซีบีซี (ไทย)','ธนาคารอิสลามแห่งประเทศไทย',
  'ธนาคารไทยเครดิต','ธนาคารสแตนดาร์ดชาร์เตอร์ด (ไทย)','ซิตี้แบงก์','ทรูมันนี่ วอลเล็ต','พร้อมเพย์','อื่น ๆ'];
const NATS = ['จีน','ลาว','ไทย','อื่น ๆ'];
const NAT_CLS = {'จีน':'cn','ลาว':'la','ไทย':'th'};
const STATUSES = ['ยึด','อายัด','ปลดอายัด'];
const ST_CLS = {'ยึด':'seize','อายัด':'freeze','ปลดอายัด':'release'};
const APPT_TYPES = ['นัดพบพนักงานสอบสวน','ให้ปากคำเพิ่มเติม','ส่งเอกสาร/หลักฐาน','ขออายัดบัญชี','ขอปลดอายัด','ติดตามความคืบหน้า','นัดไกล่เกลี่ย','นัดศาล','อื่น ๆ'];

/* ---------- boot / API ---------- */
const bootEl = document.getElementById('boot');
const clean = v => (v && v.indexOf('<' + '?') !== 0) ? v : '';
const BOOT = { caseId: clean(bootEl.dataset.case), appUrl: clean(bootEl.dataset.url) };
/* ===== ตั้งค่าสำหรับ GitHub Pages: วาง URL /exec ของ Apps Script ระหว่าง '' ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwla4w08oYolMxedV-L555WswJvu3KrHmPhndnfJlSIAZGEb5-P_rbkhnkAsM-NUlP2hg/exec';
/* ============================================================================ */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const IS_REMOTE = !IS_GAS && /^https:\/\//.test(API_URL);
if (!BOOT.caseId && !IS_GAS) { try { BOOT.caseId = new URLSearchParams(location.search).get('case') || ''; } catch (e) {} }
const appUrl = () => BOOT.appUrl || location.href.split('?')[0].split('#')[0];
const caseUrl = id => appUrl() + '?case=' + encodeURIComponent(id);

const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };
let TOKEN = lsGet('paw_token');
const gas = (fn, ...args) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
async function remote(fn, ...args) {
  let r;
  try { r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, args }) }); } // ไม่ใส่ header → ไม่ติด CORS preflight
  catch (e) { throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจ API_URL และอินเทอร์เน็ต'); }
  let j; try { j = await r.json(); } catch (e) { throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง — ตรวจว่า deploy แบบ "ทุกคน" แล้ว'); }
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
const pub = (fn, ...args) => IS_GAS ? gas(fn, ...args) : IS_REMOTE ? remote(fn, ...args) : Mock[fn](...args); // ไม่ต้องล็อกอิน
async function call(fn, ...args) { // ต้องล็อกอิน
  try { return await (IS_GAS ? gas('api', TOKEN, fn, args) : IS_REMOTE ? remote('api', TOKEN, fn, args) : Mock.api(TOKEN, fn, args)); }
  catch (e) {
    if (errMsg(e).indexOf('SESSION_EXPIRED') >= 0) { endSession(); showLogin('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่'); throw new Error('กรุณาเข้าสู่ระบบใหม่'); }
    throw e;
  }
}

const Mock = (() => { // โหมดทดลอง เมื่อเปิดไฟล์นอก Apps Script (ไม่มีความปลอดภัยจริง)
  const KEY = 'paw_demo_v3'; const files = {};
  const get = (k, d) => { try { return JSON.parse(localStorage.getItem(KEY + k) || d); } catch (e) { return JSON.parse(d); } };
  const put = (k, v) => { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} };
  let cases = get('_cases', '[]'), admins = get('_admins', '[]'), sess = get('_sess', '{}');
  const save = () => { put('_cases', cases); put('_admins', admins); put('_sess', sess); };
  const h = pw => 'demo:' + btoa(unescape(encodeURIComponent(pw)));
  const chk = pw => { if (String(pw || '').length < 6) throw new Error('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'); };
  const same = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
  const list = () => admins.map(a => ({ name: a.name, hasPw: !!a.hash, role: a.role === 'admin' ? 'admin' : 'user' }));
  const nAdmin = () => admins.filter(a => a.role === 'admin' && a.hash).length;
  const addFile = (id, f) => { (files[id] = files[id] || []).unshift(Object.assign({ url: '#', updated: new Date().toISOString() }, f)); return files[id]; };
  const core = {
    listCases: () => cases.slice().sort((a, b) => b.year - a.year || b.seq - a.seq),
    getCase: id => cases.find(c => c.id === id) || null,
    saveCase: d => {
      const now = new Date().toISOString();
      if (d.id) { const c = cases.find(x => x.id === d.id); Object.assign(c, d, { damage: Number(d.damage) || 0, updatedAt: now, updatedBy: d.actor }); save(); return c; }
      const year = Number(d.year) || thisBE();
      const seq = cases.filter(c => c.year === year).reduce((m, c) => Math.max(m, c.seq), 0) + 1;
      const c = Object.assign({}, d, { id: 'demo-' + Date.now(), seq, year, damage: Number(d.damage) || 0, folderUrl: '', createdAt: now, updatedAt: now, createdBy: d.actor, updatedBy: d.actor });
      cases.push(c); save(); return c;
    },
    deleteCase: id => { cases = cases.filter(c => c.id !== id); save(); return true; },
    extractFromImages: () => { throw new Error('การอ่านรูปด้วย AI ใช้ได้เมื่อเชื่อมต่อ Apps Script จริงเท่านั้น'); },
    listFiles: id => files[id] || [],
    uploadFile: (id, name, mime) => addFile(id, { name, mime }),
    createDoc: (id, title) => addFile(id, { name: title, mime: 'application/vnd.google-apps.document' }),
    listAdmins: list,
    addAdmin: (n, pw, role) => { n = String(n || '').trim(); if (!n) throw new Error('กรุณากรอกชื่อผู้ใช้'); chk(pw);
      if (admins.some(a => same(a.name, n))) throw new Error('มีชื่อ "' + n + '" อยู่แล้ว — กรุณาใช้ชื่ออื่น');
      admins.push({ name: n, hash: h(pw), role: role === 'admin' ? 'admin' : 'user' }); save(); return list(); },
    setRole: (n, role) => { const a = admins.find(x => x.name === n); role = role === 'admin' ? 'admin' : 'user';
      if (role === 'user' && a.role === 'admin' && nAdmin() <= 1) throw new Error('ต้องมี ADMIN อย่างน้อย 1 คน'); a.role = role; save(); return list(); },
    setPassword: (n, pw) => { chk(pw); admins.find(a => a.name === n).hash = h(pw); save(); return list(); },
    renameAdmin: (o, n) => { n = String(n || '').trim(); if (!n) throw new Error('กรุณากรอกชื่อใหม่');
      if (admins.some(a => a.name !== o && same(a.name, n))) throw new Error('มีชื่อ "' + n + '" อยู่แล้ว — กรุณาใช้ชื่ออื่น');
      admins.find(a => a.name === o).name = n; cases.forEach(c => { if (c.admin === o) c.admin = n; }); save(); return list(); },
    removeAdmin: n => { const a = admins.find(x => x.name === n); if (a && a.role === 'admin' && nAdmin() <= 1) throw new Error('ต้องมี ADMIN อย่างน้อย 1 คน');
      admins = admins.filter(x => x.name !== n); save(); return list(); }
  };
  const login = (n, pw) => {
    const a = admins.find(x => same(x.name, String(n || '')));
    if (!a || !a.hash || a.hash !== h(String(pw || ''))) throw new Error(a && !a.hash ? 'ชื่อนี้ยังไม่มีรหัสผ่าน — กรุณาติดต่อ ADMIN' : 'ชื่อหรือรหัสผ่านไม่ถูกต้อง');
    const token = 't' + Date.now() + Math.random().toString(36).slice(2); sess[token] = a.name; save();
    return { token, name: a.name, role: a.role === 'admin' ? 'admin' : 'user' };
  };
  return {
    bootstrap: async () => ({ needsSetup: nAdmin() === 0 }),
    setupFirst: async (n, pw) => { if (nAdmin() > 0) throw new Error('ตั้งค่าครั้งแรกไปแล้ว'); chk(pw);
      const a = admins.find(x => same(x.name, String(n || ''))); if (a) { a.hash = h(pw); a.role = 'admin'; } else core.addAdmin(n, pw, 'admin'); save(); return login(n, pw); },
    login: async (n, pw) => login(n, pw),
    logout: async t => { delete sess[t]; save(); return true; },
    api: async (t, fn, args) => {
      const u = sess[t], me = admins.find(a => a.name === u && a.hash); if (!me) throw new Error('SESSION_EXPIRED');
      if (['addAdmin', 'renameAdmin', 'removeAdmin', 'setPassword', 'setRole'].includes(fn) && me.role !== 'admin') throw new Error('เฉพาะ ADMIN เท่านั้น');
      args = args || [];
      if (fn === 'saveCase') args[0] = Object.assign({}, args[0], { actor: u });
      if (fn === 'removeAdmin' && args[0] === u) throw new Error('ลบชื่อของตัวเองไม่ได้');
      const out = core[fn](...args);
      if (fn === 'renameAdmin' && args[0] === u) { sess[t] = String(args[1]).trim(); save(); }
      return JSON.parse(JSON.stringify(out));
    }
  };
})();

/* ---------- helpers ---------- */
const app = document.getElementById('app');
let CASES = [];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const thisBE = () => new Date().getFullYear() + 543;
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fmtDate = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtMoney = n => Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const natLabel = s => s.nationality === 'อื่น ๆ' ? (s.nationalityOther || 'อื่น ๆ') : (s.nationality || '');
const bankLabel = i => i.bank === 'อื่น ๆ' ? (i.bankOther || 'อื่น ๆ') : (i.bank || '');
const apptText = a => [a.type, a.detail].filter(Boolean).join(' — ');
const caseTitle = c => c.caseNo ? 'คดีที่ ' + c.caseNo : 'ยังไม่ระบุเลขคดี';
const seqLabel = c => 'ลำดับที่ ' + c.seq + '/' + c.year;
const itemsOf = c => c.items || [];
const stationNames = c => [...new Set(itemsOf(c).map(i => i.station).filter(Boolean))].join(', ');
const stChip = s => `<span class="st ${ST_CLS[s] || ''}">${esc(s || 'ยังไม่ดำเนินการ')}</span>`;
function nextAppt(c) {
  const t = todayStr();
  return (c.appointments || []).filter(a => !a.done && a.date && a.date >= t)
    .sort((x, y) => (x.date + (x.time || '')).localeCompare(y.date + (y.time || '')))[0];
}
function toast(msg, ms = 2400) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
function errMsg(e) { return (e && e.message) || String(e); }
let ADMINS = [], NOPW = new Set(), ROLES = {};
let ROLE = lsGet('paw_role');
const isAdmin = () => ROLE === 'admin';
let CURRENT = lsGet('paw_user');

function bahtText(num) {
  num = Math.round(Number(num || 0) * 100) / 100;
  if (!num) return 'ศูนย์บาทถ้วน';
  const d = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'], p = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
  const read = (s, prefixed) => {
    let out = '';
    if (s.length > 6) { out += read(s.slice(0, -6), false) + 'ล้าน'; s = s.slice(-6); prefixed = true; }
    const n = s.length;
    for (let i = 0; i < n; i++) {
      const x = +s[i], pos = n - 1 - i; if (!x) continue;
      if (pos === 1 && x === 1) out += 'สิบ';
      else if (pos === 1 && x === 2) out += 'ยี่สิบ';
      else if (pos === 0 && x === 1 && (prefixed || (n > 1 && Number(s.slice(0, -1)) > 0))) out += 'เอ็ด';
      else out += d[x] + p[pos];
    }
    return out;
  };
  const baht = Math.floor(num), st = Math.round((num - baht) * 100);
  return (baht ? read(String(baht), false) + 'บาท' : '') + (st ? read(String(st), false) + 'สตางค์' : 'ถ้วน');
}

function qrDataUrl(text, size = 512) {
  const div = document.createElement('div');
  div.style.cssText = 'position:absolute;left:-9999px';
  document.body.appendChild(div);
  new QRCode(div, { text, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
  const url = div.querySelector('canvas').toDataURL('image/png');
  div.remove();
  return url;
}

function replaceCase(saved) { const i = CASES.findIndex(x => x.id === saved.id); if (i >= 0) CASES[i] = saved; else CASES.unshift(saved); }

function renderFiles(files) {
  const el = document.getElementById('files'); if (!el) return;
  el.classList.remove('muted');
  el.innerHTML = files.length ? files.map(f => `<div class="file"><span>${f.mime && f.mime.indexOf('google-apps.document') >= 0 ? '📝' : f.mime && f.mime.indexOf('image') === 0 ? '🖼' : f.mime === 'application/pdf' ? '📕' : '📄'}</span>
    <a href="${esc(f.url)}" target="_blank">${esc(f.name)}</a></div>`).join('') : '<div class="muted">ยังไม่มีเอกสาร</div>';
}

async function uploadFiles(c, list) {
  const files = [...list]; if (!files.length) return;
  for (let k = 0; k < files.length; k++) {
    const f = files[k];
    if (f.size > 40 * 1024 * 1024) { toast(`${f.name} ใหญ่เกิน 40MB — อัปโหลดผ่าน Drive โดยตรงแทน`, 4000); continue; }
    toast(`กำลังอัปโหลด ${k + 1}/${files.length}: ${f.name}`, 60000);
    const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
    try { renderFiles(await call('uploadFile', c.id, f.name, f.type, b64)); } catch (e) { toast('อัปโหลดไม่สำเร็จ: ' + errMsg(e), 4000); return; }
  }
  toast('อัปโหลดเสร็จแล้ว');
}

/* ---------- AI: เตรียมไฟล์ + เติมข้อมูลลงฟอร์ม ---------- */
async function prepAiFile(f) {
  const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
  if (f.type === 'application/pdf') {
    if (f.size > 15 * 1024 * 1024) throw new Error(f.name + ' ใหญ่เกิน 15MB');
    return { mime: f.type, data: await toB64(f) };
  }
  // ย่อรูปให้ด้านยาวไม่เกิน 2000px เพื่อส่งเร็วขึ้น
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('เปิดรูป ' + f.name + ' ไม่ได้')); i.src = URL.createObjectURL(f); });
  const k = Math.min(1, 2000 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(img.src);
  return { mime: 'image/jpeg', data: cv.toDataURL('image/jpeg', 0.85).split(',')[1] };
}
function applyExtract(frm, d) {
  d = d || {};
  const setIf = (name, v) => { const el = frm.elements[name]; if (el && v && !String(el.value).trim()) el.value = v; };
  setIf('caseNo', d.caseNo);
  if (Number(d.damage) && !frm.elements.damage.value.trim()) { frm.elements.damage.value = fmtMoney(d.damage); frm.elements.damage.dispatchEvent(new Event('input')); }
  if (d.notes) frm.elements.notes.value = [frm.elements.notes.value.trim(), d.notes].filter(Boolean).join('\n');
  const isEmpty = r => ![...r.querySelectorAll('input')].some(i => i.type !== 'checkbox' && i.value.trim());
  const fill = (boxId, cls, fn, list) => {
    if (!list || !list.length) return;
    const box = document.getElementById(boxId);
    box.querySelectorAll('.' + cls).forEach(r => { if (isEmpty(r)) r.remove(); });
    list.forEach(x => box.insertAdjacentHTML('beforeend', fn(x)));
  };
  fill('items', 'r-item', itemRow, (d.items || []).map(i => {
    const x = Object.assign({}, i);
    if (x.bank && !BANKS.includes(x.bank)) { x.bankOther = x.bank; x.bank = 'อื่น ๆ'; }
    if (!STATUSES.includes(x.status)) x.status = '';
    return x;
  }));
  fill('suspects', 'r-suspect', suspectRow, (d.suspects || []).map(s => {
    const x = Object.assign({}, s);
    if (x.nationality && !NATS.includes(x.nationality)) { x.nationalityOther = x.nationality; x.nationality = 'อื่น ๆ'; }
    return x;
  }));
  fill('appts', 'r-appt', apptRow, (d.appointments || []).map(a => {
    const x = Object.assign({}, a);
    if (x.type && !APPT_TYPES.includes(x.type)) { x.detail = [x.type, x.detail].filter(Boolean).join(' — '); x.type = ''; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(x.date || '')) x.date = '';
    return x;
  }));
}

  <div class="toolbar"><button class="btn" onclick="showList()">← รายการ</button><h2>จัดการผู้ใช้</h2></div>
  <div class="card"><h3>สร้างผู้ใช้ใหม่</h3>
    <form id="admFrm" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;align-items:end">
      <div><label>ชื่อผู้ใช้ (ห้ามซ้ำ)</label><input name="n" required autocomplete="off"></div>
      <div><label>รหัสผ่าน (อย่างน้อย 6 ตัว)</label><input name="p" type="password" required autocomplete="new-password"></div>
      <div><label>ยืนยันรหัสผ่าน</label><input name="p2" type="password" required autocomplete="new-password"></div>
      <div><label>สิทธิ์</label><select name="r">${roleOpts('user')}</select></div>
      <div><button class="btn primary" style="width:100%;justify-content:center">สร้าง</button></div>
    </form>
    <div class="muted" style="margin-top:8px"><b>ADMIN</b> สร้าง/แก้/ลบผู้ใช้ และตั้งรหัสผ่านได้ · <b>เจ้าหน้าที่</b> ใช้งานสำนวนได้ แต่สร้างชื่อหรือเปลี่ยนรหัสผ่านเองไม่ได้</div>
  </div>
  <div class="card"><h3>ผู้ใช้ทั้งหมด (${ADMINS.length})</h3>
    ${ADMINS.map((a, i) => `<div class="adm"><b>${esc(a)}</b>
      ${a === CURRENT ? '<span class="st release">คุณ</span>' : ''}${NOPW.has(a) ? '<span class="st seize">ยังไม่มีรหัสผ่าน</span>' : ''}
      <span class="muted">${count(a)} สำนวน</span>
      <select data-role="${i}" style="width:auto;padding:3px 6px;font-size:13px">${roleOpts(ROLES[a])}</select>
      <button class="btn sm" data-pw="${i}">${NOPW.has(a) ? 'ตั้งรหัสผ่าน' : 'เปลี่ยนรหัสผ่าน'}</button>
      <button class="btn sm" data-ren="${i}">แก้ชื่อ</button>
      ${a === CURRENT ? '' : `<button class="btn sm danger" data-del="${i}">ลบ</button>`}</div>
      <form class="pwf" data-for="${i}" style="display:none;gap:6px;flex-wrap:wrap;padding:8px 0">
        <input name="p" type="password" placeholder="รหัสผ่านใหม่ของ ${esc(a)}" autocomplete="new-password" style="flex:1;min-width:150px" required>
        <input name="p2" type="password" placeholder="ยืนยันรหัสผ่าน" autocomplete="new-password" style="flex:1;min-width:150px" required>
        <button class="btn primary sm">บันทึก</button></form>`).join('')}
  </div>`;
  const run = async (p, msg) => { try { setAdmins(await p); await refresh(); renderHdr(); toast(msg); isAdmin() ? showAdmins() : showList(); return true; } catch (e) { toast(errMsg(e), 4000); showAdmins(); return false; } };
  const pwOk = (p, p2) => { if (p !== p2) { toast('รหัสผ่านทั้งสองช่องไม่ตรงกัน', 3000); return false; } return true; };
  document.getElementById('admFrm').onsubmit = e => {
    e.preventDefault(); const f = e.target, n = f.n.value.trim();
    if (pwOk(f.p.value, f.p2.value)) run(call('addAdmin', n, f.p.value, f.r.value), 'สร้างผู้ใช้ ' + n + ' (' + roleLabel(f.r.value) + ') แล้ว');
  };
  app.querySelectorAll('[data-role]').forEach(sel => sel.onchange = () => {
    const n = ADMINS[+sel.dataset.role];
    if (n === CURRENT && sel.value !== 'admin' && !confirm('ลดสิทธิ์ตัวเองเป็นเจ้าหน้าที่? คุณจะจัดการผู้ใช้ไม่ได้อีก')) { sel.value = 'admin'; return; }
    run(call('setRole', n, sel.value), n + ' เป็น ' + roleLabel(sel.value) + ' แล้ว');
  });
  app.querySelectorAll('[data-pw]').forEach(b => b.onclick = () => { const f = app.querySelector(`.pwf[data-for="${b.dataset.pw}"]`); const show = f.style.display === 'none'; f.style.display = show ? 'flex' : 'none'; if (show) f.p.focus(); });
  app.querySelectorAll('.pwf').forEach(f => f.onsubmit = e => {
    e.preventDefault(); const n = ADMINS[+f.dataset.for];
    if (pwOk(f.p.value, f.p2.value)) run(call('setPassword', n, f.p.value), 'บันทึกรหัสผ่านของ ' + n + ' แล้ว');
  });
  app.querySelectorAll('[data-ren]').forEach(b => b.onclick = async () => {
    const o = ADMINS[+b.dataset.ren], n = prompt('แก้ชื่อ ' + o + ' เป็น', o);
    if (!n || n.trim() === o) return;
    const self = o === CURRENT;
    if (self) { CURRENT = n.trim(); lsSet('paw_user', CURRENT); }
    if (!await run(call('renameAdmin', o, n), 'แก้ชื่อแล้ว (สำนวนที่รับผิดชอบเปลี่ยนตามด้วย)') && self) { CURRENT = o; lsSet('paw_user', o); renderHdr(); }
  });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const n = ADMINS[+b.dataset.del];
    if (confirm('ลบผู้ใช้ ' + n + '?\n(เข้าระบบไม่ได้อีก แต่สำนวนเดิมยังแสดงชื่อนี้อยู่)')) run(call('removeAdmin', n), 'ลบแล้ว');
  });
}

/* ---------- เข้าสู่ระบบ ---------- */
async function enter() {
  await refresh();
  const id = BOOT.caseId; BOOT.caseId = '';
  if (id) showDetail(id); else showList();
}
function authForm(title, note, setup, msg) {
  renderHdr();
  app.innerHTML = `${demoBar()}<div class="card login"><h3>${title}</h3>
    ${note ? `<div class="muted">${note}</div>` : ''}${msg ? `<div class="demo" style="margin-top:8px">${esc(msg)}</div>` : ''}
    <form id="lf">
      <label>ชื่อผู้ใช้</label><input name="n" required autocomplete="username" value="${setup ? '' : esc(lsGet('paw_user_last'))}">
      <label>รหัสผ่าน${setup ? ' (อย่างน้อย 6 ตัว)' : ''}</label><input name="p" type="password" required autocomplete="${setup ? 'new-password' : 'current-password'}">
      ${setup ? '<label>ยืนยันรหัสผ่าน</label><input name="p2" type="password" required autocomplete="new-password">' : ''}
      <button class="btn primary" style="margin-top:14px;width:100%;justify-content:center">${setup ? 'สร้างและเข้าสู่ระบบ' : 'เข้าสู่ระบบ'}</button>
    </form>
    ${setup ? '' : '<div class="muted" style="margin-top:10px">ลืมรหัสผ่าน หรือยังไม่มีบัญชี — กรุณาติดต่อ ADMIN</div>'}</div>`;
  const f = document.getElementById('lf');
  (f.n.value ? f.p : f.n).focus();
  f.onsubmit = async e => {
    e.preventDefault();
    if (setup && f.p.value !== f.p2.value) { toast('รหัสผ่านทั้งสองช่องไม่ตรงกัน', 3000); return; }
    const btn = f.querySelector('button'); btn.disabled = true;
    try { startSession(await pub(setup ? 'setupFirst' : 'login', f.n.value.trim(), f.p.value)); await enter(); }
    catch (err) { toast(errMsg(err), 4000); btn.disabled = false; f.p.value = ''; f.p.focus(); }
  };
}
const showLogin = msg => authForm('เข้าสู่ระบบ PAW', '', false, msg);
const showSetup = () => authForm('ตั้งค่าครั้งแรก', 'สร้าง ADMIN คนแรกพร้อมรหัสผ่าน — ผู้ใช้คนอื่น ADMIN จะเป็นผู้สร้างให้ที่เมนู “จัดการผู้ใช้”', true);

/* ---------- start ---------- */
(async () => {
  renderHdr();
  try {
    if (TOKEN) { try { await enter(); return; } catch (e) { endSession(); } }
    const b = await pub('bootstrap');
    if (b.needsSetup) showSetup(); else showLogin();
  } catch (e) {
    app.innerHTML = `<div class="empty">โหลดข้อมูลไม่สำเร็จ: ${esc(errMsg(e))}</div>`;
  }
})();
</script>
</body>
</html>
